      //Erro Handling Using try/catch
      const users = {
        name: "Alice",
        email: "alice@email.com",
      };
      //Create User
      async function createUser() {
        try{
          const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(users), // Request Body
          },
        );
       
        
         if(!response.ok){
            throw new Error("Failed to create user");
        }
       

        const data = await response.json(); // Response Body

        console.log("POST Status:", response.status);
        console.log("Created User:", data);
       }catch(error){
        console.log("POST Error:", error.message);
       }
       
      }
      //Get User
      async function getUsers() {
        try{
           
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/users",
        );
        
       if(!response.ok){
            throw new Error("Failed to Get user");
        }
    const data = await response.json(); // Response Body

        console.log("GET Status:", response.status);
        console.log("Users:", data);



       }catch(error){
         console.log("GET Error:", error.message);
        }
      }
      // Run both functions in the correct order
      async function main() {
        await createUser(); // Wait until the POST request finishes
        await getUsers(); // Then fetch the users
      }
      main();
